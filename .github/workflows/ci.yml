# Runs the repo's check (lint, type check, tests) and a production build on every pull request
# and on pushes to main. A newer push to the same branch cancels the run still in progress.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node 20.19+ or 22.12+; 22 matches local development.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type check and tests
        run: npm run check

      - name: Production build
        run: npm run build
